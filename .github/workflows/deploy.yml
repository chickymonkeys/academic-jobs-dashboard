# Fetches the listing sources (scripts/ingest.ts), builds the app and deploys it to Cloudflare Workers
# with Void: on every push to main and every 3 hours. The MUR portal and AcademicTransfer are re-read at most
# every 12 hours; between their refreshes the run reuses the cached payload. The snapshot (public/data) is never
# committed; it lives only in the deployed site. Open tabs pick up a new one within META_POLL_MS because the client polls
# /data/meta.json for a new version.
#
# Only pipeline state without personal data is committed back: data/seen.json (first-seen dates,
# the "new" signal) and data/geocache.json (institution coordinates).
#
# Setup (once): repository secret CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template) and
# repository variable CLOUDFLARE_WORKERS_SUBDOMAIN (your <name>.workers.dev). The account comes
# from void.lock.json; set CLOUDFLARE_ACCOUNT_ID only to deploy somewhere else.
name: deploy
on:
  push:
    branches: [main]
  schedule: [{ cron: "17 */3 * * *" }]
  workflow_dispatch: {}
concurrency:
  group: deploy-${{ github.repository }}
  # Queue instead of cancelling, so a run never dies between committing state and deploying
  cancel-in-progress: false
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The deadline and geocoding heuristics are checked against phrasings from real postings
      - run: pnpm test
      # Last good upstream payloads: a feed that is down falls back to its previous copy instead of vanishing
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: ingest-raw-${{ github.run_id }}
          restore-keys: ingest-raw-
      - run: pnpm ingest --geocode-budget=300
      - name: Refuse an empty snapshot
        run: jq -e '.total > 0' public/data/meta.json
      - name: Commit pipeline state if it changed
        run: |
          git config user.name "ingest-bot"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add data/geocache.json data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update ingest state $(date -u +%FT%TZ)"
            git pull --rebase
            git push
          fi
      # `void deploy` runs `pnpm run build` (vite build, then vue-tsc), so a type error stops the deploy
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec void deploy --platform cloudflare
      - name: Build only (no Cloudflare token yet)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          pnpm build
          echo "::notice::CLOUDFLARE_API_TOKEN is not set; built and type-checked, but skipped the deploy."
