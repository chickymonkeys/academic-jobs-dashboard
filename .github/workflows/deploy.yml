# Fetches the listing sources (scripts/ingest.ts), builds the app and publishes it to GitHub Pages, where it is
# served under the repository's name (pizzigolot.to/academic-jobs-dashboard/): on every push to main and every
# 3 hours. The MUR portal and AcademicTransfer are re-read at most every 12 hours; between their refreshes the run
# reuses the cached payload. The snapshot (public/data) is never committed: the build, snapshot included, goes to
# Pages as this run's artifact. Open tabs pick up a new one within META_POLL_MS because the client polls
# data/meta.json for a new version.
#
# Only pipeline state without personal data is committed back: data/seen.json (first-seen dates,
# the "new" signal) and data/geocache.json (institution coordinates). main is protected by a ruleset
# (pull requests only), which deploy keys bypass, so the state is pushed with one (INGEST_DEPLOY_KEY).
#
# Setup (once): Settings → Pages → Source: GitHub Actions. Publishing uses the workflow's own token, so there is no
# deploy secret. With main protected, also secret INGEST_DEPLOY_KEY: the private half of a deploy key with write
# access (see README).
name: deploy
on:
  push:
    branches: [main]
  schedule: [{ cron: "17 */3 * * *" }]
  workflow_dispatch: {}
concurrency:
  group: deploy-${{ github.repository }}
  # Queue instead of cancelling, so a run never dies between committing state and deploying
  cancel-in-progress: false
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Git runs with the deploy key, which may push to the protected main; without the secret, the workflow token
      - uses: actions/checkout@v6
        with: { ssh-key: "${{ secrets.INGEST_DEPLOY_KEY }}" }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The deadline and geocoding heuristics are checked against phrasings from real postings
      - run: pnpm test
      # Last good upstream payloads: a feed that is down falls back to its previous copy instead of vanishing
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: ingest-raw-${{ github.run_id }}
          restore-keys: ingest-raw-
      - run: pnpm ingest --geocode-budget=300
      - name: Refuse an empty snapshot
        run: jq -e '.total > 0' public/data/meta.json
      - name: Commit pipeline state if it changed
        run: |
          git config user.name "ingest-bot"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add data/geocache.json data/seen.json
          # [skip ci]: unlike the workflow token's, a deploy key's push would start this workflow again
          if ! git diff --cached --quiet; then
            git commit -m "data: update ingest state $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase
            git push
          fi
      # vite build, then vue-tsc, so a type error stops the deploy
      - run: pnpm build
      # Pages has no single-page-app fallback: its 404 page opens the map instead of GitHub's error page
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/client }
  # Only this job holds the Pages credentials; the one that runs the ingest never does
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
